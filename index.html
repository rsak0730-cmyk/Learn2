<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#070a12"
  >

  <meta
    name="description"
    content="CodeVerse — Learn programming through interactive lessons, coding challenges, visual labs and projects."
  >

  <title>CodeVerse</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #070a12;
    }

    body {
      color: #eef2ff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070a12;
      z-index: 999999;
    }

    .loader {
      width: 46px;
      height: 46px;
      border: 3px solid #20293a;
      border-top-color: #8b7cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error {
      max-width: 620px;
      margin: 30px;
      padding: 28px;
      border: 1px solid #263044;
      border-radius: 18px;
      background: #0d121e;
      color: #eef2ff;
    }

    .error h1 {
      margin-top: 0;
    }

    .error p {
      color: #8994aa;
      line-height: 1.6;
    }

    .error pre {
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      border-radius: 10px;
      background: #070a12;
      color: #ff8fa3;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loader"></div>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener("error", function (event) {
      console.error(event.error || event.message);
    });

    window.addEventListener(
      "unhandledrejection",
      function (event) {
        console.error(event.reason);
      }
    );

    setTimeout(function () {
      var loading = document.getElementById("loading");

      if (loading) {
        loading.remove();
      }
    }, 10000);
  </script>

  <!-- Vite development/source entry -->
  <script type="module" src="./src/main.jsx"></script>

</body>
</html>
