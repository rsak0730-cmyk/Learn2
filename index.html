<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070a12" />
  <meta
    name="description"
    content="CodeVerse Academy — Interactive programming learning engine with in-browser execution, structured milestones, and AI guidance."
  />
  <title>CodeVerse Academy</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #070a12;
    }

    body {
      color: #eef2ff;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #070a12;
      z-index: 999999;
      transition: opacity 0.3s ease;
    }

    .loader {
      width: 44px;
      height: 44px;
      border: 3px solid #20293a;
      border-top-color: #8b7cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #8994aa;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
  </style>

  <!-- Pyodide: WebAssembly runtime for client-side Python execution -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js" defer></script>
</head>

<body>
  <div id="loading">
    <div class="loader"></div>
    <span class="loading-text">Loading CodeVerse Academy...</span>
  </div>

  <div id="root"></div>

  <script>
    // Fail-safe cleanup to ensure the loader never hangs on screen
    setTimeout(function () {
      var loader = document.getElementById("loading");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(function () {
          if (loader) loader.remove();
        }, 300);
      }
    }, 2500);

    window.addEventListener("error", function (event) {
      console.error(event.error || event.message);
      var loader = document.getElementById("loading");
      if (loader) loader.remove();
    });

    window.addEventListener("unhandledrejection", function (event) {
      console.error(event.reason);
      var loader = document.getElementById("loading");
      if (loader) loader.remove();
    });
  </script>

  <!-- Vite module entry point -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
